[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sdid-multimetric"
version = "0.1.0"
description = "Multi-metric unit weight estimation for Synthetic Difference-in-Differences"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/abrishaerc/sdid_multi_metric"

[tool.setuptools.packages.find]
where = ["."]
include = ["sdid_multimetric*"]
